name: Binding Constraint Validation

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  check-constraint:
    runs-on: ubuntu-latest
    name: Verify Binding Constraint
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check constraint requirement
      run: |
        echo "╔════════════════════════════════════════════════════════════╗"
        echo "║         BINDING CONSTRAINT VALIDATION                      ║"
        echo "╚════════════════════════════════════════════════════════════╝"
        echo ""
        echo "Requirement: npm run ci MUST PASS + pytest MUST PASS"
        echo "Rule: Cannot proceed to Stage 7 without BOTH passing"
        echo ""
        echo "This PR will be validated by:"
        echo "  1. Backend Tests (test-backend.yml) - pytest app/tests/"
        echo "  2. Frontend Tests (test-frontend.yml) - npm ci && npm run build"
        echo ""
        echo "Status: Waiting for both workflow runs to complete..."
        echo "Once both pass, this merge will be allowed."
        echo ""
        echo "⚠️  CRITICAL: If either test fails, this PR cannot be merged"
        echo "No fake success - actual PASS/FAIL status required"
    
    - name: Verify workflow files exist
      run: |
        if [ -f ".github/workflows/test-backend.yml" ]; then
          echo "✅ Backend workflow exists"
        else
          echo "❌ Backend workflow missing"
          exit 1
        fi
        
        if [ -f ".github/workflows/test-frontend.yml" ]; then
          echo "✅ Frontend workflow exists"
        else
          echo "❌ Frontend workflow missing"
          exit 1
        fi

  backend-test-check:
    runs-on: ubuntu-latest
    name: Backend Constraint
    
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      continue-on-error: false
    
    - name: Run backend tests
      working-directory: ./backend
      run: pytest app/tests/ -v
      continue-on-error: false

  frontend-test-check:
    runs-on: ubuntu-latest
    name: Frontend Constraint
    
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './web/package-lock.json'
    
    - name: Install and build
      working-directory: ./web
      run: |
        npm ci
        npm run build
      continue-on-error: false

  constraint-summary:
    runs-on: ubuntu-latest
    name: Constraint Summary
    needs: [ backend-test-check, frontend-test-check ]
    if: always()
    
    steps:
    - name: Binding constraint result
      run: |
        echo "╔════════════════════════════════════════════════════════════╗"
        echo "║         BINDING CONSTRAINT RESULT                          ║"
        echo "╚════════════════════════════════════════════════════════════╝"
        
        if [ "${{ needs.backend-test-check.result }}" = "success" ] && [ "${{ needs.frontend-test-check.result }}" = "success" ]; then
          echo ""
          echo "✅ BINDING CONSTRAINT: PASSED"
          echo ""
          echo "✅ Backend tests: PASSED"
          echo "✅ Frontend build: PASSED"
          echo ""
          echo "This PR can proceed to merge when ready."
          exit 0
        else
          echo ""
          echo "❌ BINDING CONSTRAINT: FAILED"
          echo ""
          if [ "${{ needs.backend-test-check.result }}" != "success" ]; then
            echo "❌ Backend tests: FAILED"
          else
            echo "✅ Backend tests: PASSED"
          fi
          
          if [ "${{ needs.frontend-test-check.result }}" != "success" ]; then
            echo "❌ Frontend build: FAILED"
          else
            echo "✅ Frontend build: PASSED"
          fi
          
          echo ""
          echo "Both backend AND frontend must pass before merge."
          exit 1
        fi
