name: Frontend Build & Lint

on:
  push:
    branches: [main, develop, claude/**]
    paths:
      - 'web/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'web/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: |
          echo "=== Environment Info ==="
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Current directory: $(pwd)"
          echo ""
          echo "=== Listing web directory ==="
          ls -la
          echo ""
          echo "=== Checking for package-lock.json ==="
          [ -f package-lock.json ] && echo "✓ package-lock.json exists" || echo "✗ package-lock.json NOT FOUND"
          echo ""
          echo "=== Installing dependencies with npm ci ==="
          npm ci --verbose 2>&1 | tail -50 || (echo "npm ci failed with exit code $?"; exit 1)

      - name: Run ESLint
        working-directory: ./web
        run: npm run lint
        continue-on-error: true

      - name: Check TypeScript
        working-directory: ./web
        run: npm run typecheck

      - name: Build project
        working-directory: ./web
        run: |
          echo "=== Build Environment ==="
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "NODE_ENV: $NODE_ENV"
          echo ""
          echo "=== Checking installed packages ==="
          npm ls next react 2>&1 | head -20
          echo ""
          echo "=== Starting build ==="
          npm run build --verbose 2>&1 || (echo "Build failed with exit code $?"; exit 1)
        env:
          # Explicitly set environment for Next.js
          NODE_ENV: production

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: web/.next/
          retention-days: 5
