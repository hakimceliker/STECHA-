name: Frontend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'web/**'
      - '.github/workflows/test-frontend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'web/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './web/package-lock.json'
    
    - name: Install dependencies
      working-directory: ./web
      run: npm ci
    
    - name: Build application
      working-directory: ./web
      run: npm run build
    
    - name: Report results
      if: always()
      run: |
        echo "Frontend build execution completed"
        echo "Check above for SUCCESS/FAILED status"
