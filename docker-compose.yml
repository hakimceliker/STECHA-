services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stech
      POSTGRES_PASSWORD: stech
      POSTGRES_DB: stech
    ports:
      - "5432:5432"
    volumes:
      - stech_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://stech:stech@db:5432/stech
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  stech_db_data:
